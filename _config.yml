title: Daniel Alfasi
tagline: AI Security Research Lead
description: >-
  AI Security Research Lead at Reco. Agentic AI security, red teaming,
  and research that ships as detection.
url: "https://danielalfasi.com"
baseurl: ""
lang: en
locale: en_US
social_image: /assets/img/og-default.png

author:
  name: Daniel Alfasi
  role: AI Security Research Lead
  company: Reco
  company_url: https://www.reco.ai
  location: Tel Aviv, Israel
  linkedin: https://www.linkedin.com/in/daniel-alfasi/
  x: https://x.com/alfasiii
  x_handle: alfasiii
  scholar: https://scholar.google.com/citations?user=uxuvP0gAAAAJ
  topics:
    - agentic AI security
    - AI red teaming
    - prompt injection
    - LLM application security
    - coding agent security
    - knowledge graphs
    - graph neural networks

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

permalink: /blog/:title/

plugins:
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - AGENTS.md
  - CLAUDE.md
  - .sass-cache
  - .jekyll-cache
  - .grok
  - _preview
  - .agents
  - skills-lock.json

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Daniel Alfasi
  - scope:
      path: ""
      type: pages
    values:
      layout: page
