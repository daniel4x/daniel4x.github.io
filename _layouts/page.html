---
layout: default
---
<div class="wrap">
  <header class="page-header">
    {% if page.label %}
    <p class="mono-label">{{ page.label }}</p>
    {% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}
    <p>{{ page.subtitle }}</p>
    {% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</div>
