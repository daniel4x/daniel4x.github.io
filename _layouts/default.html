<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fafbfc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a101c" media="(prefers-color-scheme: dark)">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · {{ site.tagline }}{% endif %}</title>
  <link rel="preload" href="{{ '/assets/fonts/inter-latin-var.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% include meta.html %}
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="icon" href="{{ '/assets/img/favicon-32.png' | relative_url }}" type="image/png" sizes="32x32">
  <link rel="shortcut icon" href="{{ '/assets/img/favicon.ico' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  <link rel="alternate" type="application/feed+json" title="{{ site.title }}" href="{{ '/feed.json' | relative_url }}">
  {% if page.markdown_url %}
  <link rel="alternate" type="text/markdown" href="{{ page.markdown_url | relative_url }}">
  {% endif %}
  <link rel="describedby" href="{{ '/llms.txt' | relative_url }}">
  {% include schema.html %}
  <script type="speculationrules">
  {
    "prerender": [{
      "where": {
        "and": [
          { "href_matches": "/*" },
          { "not": { "href_matches": ["/assets/*", "/*.md", "/*.txt", "/*.xml", "/*.json"] } }
        ]
      },
      "eagerness": "moderate"
    }]
  }
  </script>
  <script defer src="{{ '/assets/js/site.js' | relative_url }}"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="site">
    {% include header.html %}
    <main id="main">
      {{ content }}
    </main>
    {% include footer.html %}
  </div>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QTTN2Y1PXB"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-QTTN2Y1PXB');
  </script>
</body>
</html>
