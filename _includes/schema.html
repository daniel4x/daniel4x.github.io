{%- assign a = site.author -%}
{%- assign origin = site.url | append: site.baseurl -%}
{%- assign page_url = page.url | replace: "index.html", "" | absolute_url -%}
{%- assign desc = page.description | default: page.subtitle | default: site.description | strip_html | normalize_whitespace -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "@id": "{{ origin }}/#website",
      "url": "{{ origin }}/",
      "name": {{ site.title | jsonify }},
      "description": {{ site.description | normalize_whitespace | jsonify }},
      "inLanguage": "{{ site.lang | default: 'en' }}",
      "publisher": { "@id": "{{ origin }}/#person" }
    },
    {
      "@type": "Person",
      "@id": "{{ origin }}/#person",
      "name": {{ a.name | jsonify }},
      "url": "{{ origin }}/",
      "image": "{{ '/assets/img/prof_pic-400.jpg' | absolute_url }}",
      "description": {{ site.description | normalize_whitespace | jsonify }},
      "jobTitle": {{ a.role | jsonify }},
      "worksFor": {
        "@type": "Organization",
        "name": {{ a.company | jsonify }},
        "url": {{ a.company_url | jsonify }}
      },
      "homeLocation": { "@type": "Place", "name": {{ a.location | jsonify }} },
      "alumniOf": [
        { "@type": "CollegeOrUniversity", "name": "Reichman University" },
        { "@type": "CollegeOrUniversity", "name": "Ariel University" }
      ],
      "knowsAbout": {{ a.topics | jsonify }},
      "sameAs": [
        {{ a.linkedin | jsonify }},
        {{ a.x | jsonify }},
        {{ a.scholar | jsonify }}
      ]
    },
    {
      "@type": "{% if page.url == '/about/' %}ProfilePage{% elsif page.url == '/blog/' %}Blog{% else %}WebPage{% endif %}",
      "@id": "{{ page_url }}#webpage",
      "url": "{{ page_url }}",
      "name": {{ page.title | default: site.title | jsonify }},
      "description": {{ desc | jsonify }},
      "inLanguage": "{{ site.lang | default: 'en' }}",
      "isPartOf": { "@id": "{{ origin }}/#website" },
      {%- if page.url == "/" or page.url == "/about/" %}
      "mainEntity": { "@id": "{{ origin }}/#person" },
      {%- endif %}
      {%- if page.url == "/blog/" %}
      "blogPost": [
        {%- for post in site.posts %}
        { "@type": "BlogPosting", "@id": "{{ post.url | absolute_url }}#article", "headline": {{ post.title | jsonify }}, "url": "{{ post.url | absolute_url }}", "datePublished": "{{ post.date | date_to_xmlschema }}" }{% unless forloop.last %},{% endunless %}
        {%- endfor %}
      ],
      {%- endif %}
      "about": { "@id": "{{ origin }}/#person" }
    }{% if page.layout == "post" %},
    {
      "@type": "BlogPosting",
      "@id": "{{ page_url }}#article",
      "mainEntityOfPage": { "@id": "{{ page_url }}#webpage" },
      "isPartOf": { "@id": "{{ '/blog/' | absolute_url }}#webpage" },
      "headline": {{ page.title | jsonify }},
      "description": {{ desc | jsonify }},
      "datePublished": "{{ page.date | date_to_xmlschema }}",
      "dateModified": "{{ page.last_modified_at | default: page.date | date_to_xmlschema }}",
      {%- assign img = page.image | default: page.card_image -%}
      {%- if img %}
      "image": "{{ img | absolute_url }}",
      {%- endif %}
      "articleSection": {{ page.category | default: "writing" | jsonify }},
      "keywords": {{ page.tags | join: ", " | jsonify }},
      "wordCount": {{ page.content | strip_html | number_of_words }},
      "inLanguage": "{{ site.lang | default: 'en' }}",
      "author": { "@id": "{{ origin }}/#person" },
      "publisher": { "@id": "{{ origin }}/#person" }
    }{% endif %}{% if page.url != "/" and page.url != "/404.html" %},
    {
      "@type": "BreadcrumbList",
      "@id": "{{ page_url }}#breadcrumb",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Home", "item": "{{ origin }}/" },
        {%- if page.layout == "post" %}
        { "@type": "ListItem", "position": 2, "name": "Blog", "item": "{{ '/blog/' | absolute_url }}" },
        { "@type": "ListItem", "position": 3, "name": {{ page.title | jsonify }} }
        {%- else %}
        { "@type": "ListItem", "position": 2, "name": {{ page.title | jsonify }} }
        {%- endif %}
      ]
    }{% endif %}
  ]
}
</script>
